<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레퍼런스 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  html,body{height:100%;margin:0;background:#1f2022;color:#e3e4e6;font:13px/1.45 "IBM Plex Sans KR",system-ui,sans-serif}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#8e9298}
</style>
<script>
/* 이 파일은 거의 바뀌지 않는 '로더'예요. 실제 화면(app.js)과 데이터(data.json)는
   GitHub의 version.json을 10초마다 확인해 새로고침 없이 반영해요. */
window.RB = { owner: "sewon-hong", repo: "refboard", branch: "main", pollMs: 10000 };
</script>
</head>
<body>
<div id="boot">레퍼런스 보드를 불러오는 중…</div>
<script>
(() => {
  const RB = window.RB;
  const local = location.protocol === "file:" || /^(localhost|127\.)/.test(location.hostname);
  RB.local = local;
  RB.token = () => { try { return localStorage.getItem("rb.token") || ""; } catch { return ""; } };
  RB.headers = (extra) => {
    const h = { Accept: "application/vnd.github+json", ...(extra || {}) };
    const t = RB.token(); if (t) h.Authorization = "Bearer " + t;
    return h;
  };
  RB.api = (path) => `https://api.github.com/repos/${RB.owner}/${RB.repo}/${path}`;
  RB.raw = (sha, path) => local ? path : `https://raw.githubusercontent.com/${RB.owner}/${RB.repo}/${sha}/${path}`;

  /* 새 버전 확인: GitHub API(시간당 60회 제한) 대신 version.json(파일 해시)을 raw 주소로 확인해요.
     ?t= 를 붙여 캐시를 피해요. API는 쓰지 않아서 횟수 제한에 걸리지 않아요. */
  const rawMain = (path) => local ? path + "?t=" + Date.now()
    : `https://raw.githubusercontent.com/${RB.owner}/${RB.repo}/${RB.branch}/${path}?t=${Date.now()}`;
  const getText = async (path) => {
    let r;
    try { r = await fetch(rawMain(path), { cache: "no-store" }); } catch (e) { r = null; }
    if (!r || !r.ok) r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });   // Pages 사본으로 대신
    if (!r.ok) throw new Error(path + " " + r.status);
    return r.text();
  };
  const getVersion = async () => { try { return JSON.parse(await getText("version.json")); } catch { return null; } };
  RB.latestSha = async () => null;

  let ver = null, appCode = null;
  async function boot() {
    ver = await getVersion();
    const [code, json] = await Promise.all([getText("app.js"), getText("data.json")]);
    appCode = code;
    RB.sha = ver ? ver.data : "0";
    RB.data = JSON.parse(json);
    const s = document.createElement("script");
    s.src = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    document.body.append(s);
  }
  async function poll() {
    try {
      const v = await getVersion();
      if (v && ver && v.app !== ver.app) { RB.beforeReload && RB.beforeReload(); location.reload(); return; }
      if (v && (!ver || v.data !== ver.data)) {
        const data = JSON.parse(await getText("data.json"));
        ver = v; RB.sha = v.data;
        RB.onRemote && RB.onRemote(data, v.data);
      }
    } catch (e) { console.warn("poll", e); }
    setTimeout(poll, document.hidden ? RB.pollMs * 3 : RB.pollMs);
  }
  boot().then(() => { if (!local) setTimeout(poll, RB.pollMs); })
    .catch(e => { document.getElementById("boot").textContent = "불러오지 못했어요. 잠시 후 새로고침해 주세요. (" + e.message + ")"; });
})();
</script>
</body>
</html>
